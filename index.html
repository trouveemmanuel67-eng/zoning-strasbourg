<header><div><h1>Zoning d'équipe</h1><div class="sub" id="sub"></div></div>

<div class="legend np"><span><i class="dot" style="background:#4f7a62"></i>FLOOR</span><span><i class="dot" style="background:#4a7a88"></i>PIPE</span><span><i class="dot" style="background:#e6cf5c"></i>BACKUP FLOOR</span><span><i class="dot" style="background:#6a929c"></i>PIPE/CLEAN</span><span><i class="dot" style="background:#5a5c62"></i>PAUSE</span><span>Clic sur une carte ou une case : FLOOR → PIPE → BACKUP FLOOR → PAUSE → PIPE/CLEAN → vide</span></div>

<div id="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Présences (planning Teams)</h3><button class="btn" onclick="panel.classList.remove('open')">Fermer ✕</button></div>
<label><input type="checkbox" id="sun"> Afficher le dimanche</label>
<label style="margin-left:20px">Minimum sur le FLOOR : <input type="number" id="minF" min="0" value="2" style="width:50px"></label>

<script>
/*ALGO-START*/
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const SLOTS=[];for(let m=540;m<1110;m+=30)SLOTS.push(m); // 9h00..18h00 (fin 18h30)
const toM=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const fmt=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
function presentAt(p,d,m){const h=p.days[d];return !!h&&!h.absent} // tous cadres : présent toute la journée (9h00-18h30) ou absent
function generate(team,nDays,minFloor){
  const Z={};team.forEach(p=>Z[p.id]=DAYS.slice(0,nDays).map(()=>SLOTS.map(()=>null)));
  const bal={},balP={},balB={};team.forEach(p=>{bal[p.id]=0;balP[p.id]=0;balB[p.id]=0}); // floor - pipe (en créneaux)
  const ces=team.filter(p=>p.role==='CES'),sas=team.filter(p=>p.role!=='CES');
  // jour PIPE du CES : lundi sinon mardi sinon 1er jour présent
  const cesPipeDay={},usedPD={};ces.forEach(p=>{const ok=d=>presentAt(p,d,600);let d=[0,1].find(d=>ok(d)&&!usedPD[d]);if(d===undefined)d=[0,1].find(ok); // 2 CES : PIPE l'un lundi, l'autre mardi si possible
    if(d===undefined)d=[...Array(nDays).keys()].find(d=>presentAt(p,d,600)&&!usedPD[d]);if(d===undefined)d=[...Array(nDays).keys()].find(d=>presentAt(p,d,600));cesPipeDay[p.id]=d;usedPD[d]=1});
  for(let d=0;d<nDays;d++){
    const pres=p=>SLOTS.map(m=>presentAt(p,d,m));
    team.forEach(p=>{const pr=pres(p);SLOTS.forEach((m,i)=>{if(pr[i]&&m<600)Z[p.id][d][i]='CLEAN'})});
    // pauses (1h) : CES 12h30 (12h00 le jour où il fait 2h de PIPE 10h-12h, pour éviter un reste de 30 min), SA étalés 12h00/12h30/13h00
    const occ={720:0,750:0,780:0,810:0},pst={};
    const setB=(p,st)=>{const i=SLOTS.indexOf(st);if(presentAt(p,d,st)&&presentAt(p,d,st+30)){Z[p.id][d][i]='PAUSE';Z[p.id][d][i+1]='PAUSE';occ[st]++;occ[st+30]++;pst[p.id]=i;return true}return false};
    const cP=ces.filter(p=>presentAt(p,d,720)&&presentAt(p,d,810));
    if(cP.length>=2){ // 2 CES présents : 12h00-13h00 et 13h00-14h00, jamais de chevauchement ; celui qui fait PIPE ce jour prend 12h00, sinon alternance
      let e=cP.findIndex(p=>cesPipeDay[p.id]===d);if(e<0)e=d%2;const first=cP[e],second=cP[1-e];setB(first,720);setB(second,780);
      cP.slice(2).forEach(p=>[750,720,780].some(st=>setB(p,st)))}
    else ces.forEach(p=>{const pd=cesPipeDay[p.id]===d;(pd?[720,750,780]:[750,720,780]).some(st=>setB(p,st))});
    sas.forEach(p=>{const sc=st=>Math.max(occ[st],occ[st+30])*10+occ[st]+occ[st+30];const opts=[720,780,750].sort((a,b)=>sc(a)-sc(b));opts.some(st=>setB(p,st))});
    // CES : FLOOR sauf 2h PIPE (10h-12h) le jour choisi
    ces.forEach(p=>SLOTS.forEach((m,i)=>{if(presentAt(p,d,m)&&!Z[p.id][d][i]){
      Z[p.id][d][i]=(cesPipeDay[p.id]===d&&m>=600&&m<720)?'PIPE':'FLOOR'}}));
    // SA : chaque jour un temps de FLOOR, UN bloc PIPE et un bloc BACKUP FLOOR (hors 9-10h et pause), blocs ≥ 1h.
    // ≤ 2 SA en PIPE en même temps, idéalement 1 seul en BACKUP ; BACKUP ne compte pas dans le minimum FLOOR.
    // 2 SA présents : rotation complémentaire à 17h00 (l'un FLOOR, l'autre PIPE, puis échange).
    const saP=sas.filter(p=>presentAt(p,d,600)),N=SLOTS.length,two=saP.length===2,R17=SLOTS.indexOf(1020);
    const runsOk=r=>{let i=2;while(i<N){const v=r[i];let j=i;while(j+1<N&&r[j+1]===v)j++;if(v&&v!=='PAUSE'&&j===i)return false;i=j+1}return true};
    const cnt=(r,v)=>r.reduce((a,x,i)=>a+(i>=2&&x===v),0);
    const blocks=(r,v)=>{const w=r.slice(2).filter(x=>x!=='PAUSE');return w.filter((x,i)=>x===v&&w[i-1]!==v).length};
    const cands=p=>{const base=Z[p.id][d],out=[];
      const mk=(a,lp,c,lb)=>{const r=base.slice();for(let i=2;i<N;i++)if(!r[i])r[i]=(i>=a&&i<a+lp)?'PIPE':(i>=c&&i<c+lb)?'BACKUP':'FLOOR';return r};
      for(let a=2;a<N;a++)for(const lp of [2,3,4,5])for(let c=2;c<N;c++)for(const lb of [2,3,4]){if(a+lp>N||c+lb>N||(c<a+lp&&a<c+lb))continue;
        const r=mk(a,lp,c,lb);if(!runsOk(r)||blocks(r,'PIPE')!==1||blocks(r,'BACKUP')!==1||cnt(r,'PIPE')<2||cnt(r,'BACKUP')<2||cnt(r,'FLOOR')<2)continue;
        if(two&&!(r[R17]===r[R17+1]&&r[R17+1]===r[N-1]&&(r[R17]==='FLOOR'||r[R17]==='PIPE')&&r[R17-1]!==r[R17]))continue;
        out.push(r)}return out};
    const C={};saP.forEach(p=>C[p.id]=cands(p));
    const mbP=saP.reduce((a,q)=>a+balP[q.id],0)/(saP.length||1),mbB=saP.reduce((a,q)=>a+balB[q.id],0)/(saP.length||1);
    const tP=4,tB=Math.min(4,Math.max(2,Math.round(15/(saP.length||1))));
    const plan={};
    const fixedF=i=>team.filter(q=>!saP.includes(q)&&Z[q.id][d][i]==='FLOOR').length;
    const score=()=>{let sc=0;for(let i=2;i<N;i++){let f=fixedF(i),pp=0,bb=0;saP.forEach(q=>{const v=plan[q.id][i];if(v==='FLOOR')f++;if(v==='PIPE')pp++;if(v==='BACKUP')bb++});
        if(d!==5||true)sc+=Math.max(0,pp-2)*1e5;sc+=Math.max(0,minFloor-f)*1e3+Math.max(0,bb-1)*60}
      if(two){const [x,y]=saP;if(plan[x.id][R17]===plan[y.id][R17])sc+=1e4}
      saP.forEach(q=>{const r=plan[q.id];sc+=(cnt(r,'PIPE')-(tP-(balP[q.id]-mbP)/2))**2*3+(cnt(r,'BACKUP')-(tB-(balB[q.id]-mbB)/2))**2*3+(cnt(r,'FLOOR')<4?20:0)});return sc};
    saP.forEach((p,k)=>{const cs=C[p.id];plan[p.id]=cs.length?cs[(k*7+d*3)%cs.length]:Z[p.id][d].map((v,i)=>v||(i>=2&&presentAt(p,d,SLOTS[i])?'FLOOR':v))});
    for(let it=0;it<25;it++){let ch=false;saP.forEach(p=>{let best=null,keep=plan[p.id];C[p.id].forEach(r=>{plan[p.id]=r;const sc=score();if(!best||sc<best.sc)best={sc,r}});
      plan[p.id]=best?best.r:keep;if(plan[p.id]!==keep)ch=true});if(!ch)break}
    saP.forEach(p=>{Z[p.id][d]=plan[p.id];balP[p.id]+=cnt(plan[p.id],'PIPE');balB[p.id]+=cnt(plan[p.id],'BACKUP');bal[p.id]+=cnt(plan[p.id],'FLOOR')-cnt(plan[p.id],'PIPE')});
  }
  return Z;
}
function shortBlocks(Z,team,nDays){const out=[];team.forEach(p=>{for(let d=0;d<nDays;d++){const r=Z[p.id][d];let i=0;while(i<r.length){const v=r[i];let j=i;while(j+1<r.length&&r[j+1]===v)j++;if(v&&v!=='PAUSE'&&j===i)out.push({id:p.id,d,at:SLOTS[i],v});i=j+1}}});return out}
function totals(Z,id){let f=0,p=0,b=0;Z[id].forEach(r=>r.forEach(v=>{if(v==='FLOOR')f+=.5;if(v==='PIPE'||v==='CLEAN')p+=.5;if(v==='BACKUP')b+=.5}));return{f,p,b}}
if(typeof module!=='undefined')module.exports={generate,shortBlocks,totals,SLOTS,DAYS,presentAt};
/*ALGO-END*/
const MAXJ=6,nPres=(d,ex)=>S.team.filter(p=>p!==ex&&!p.days[d].absent).length;
const LAB={FLOOR:'FLOOR',PIPE:'PIPE',BACKUP:'BACKUP FLOOR',PAUSE:'PAUSE',CLEAN:'PIPE/CLEAN'},CYC=['FLOOR','PIPE','BACKUP','PAUSE','CLEAN',null];
const COL={BACKUP:'#fff3b0',FLOOR:'#cfe6d4',PIPE:'#ef8f8f',CLEAN:'#f3dde3',PAUSE:'#33ccff'};
let S=JSON.parse(localStorage.getItem('zoningStras')||'null');
const TEAM0=[['Manale','CES',3],['David','CES',4],['Hairdine','SA',0],['Francky','SA',1],['Manu','SA',2],['Tanguy','SA',5]]; // [nom, rôle, jour OFF par défaut (modifiable)]
const mkTeam=()=>TEAM0.map(([n,r,o],k)=>({id:'p'+k,name:n,role:r,days:DAYS.map((_,d)=>({absent:d===6||d===o}))}));
if(!S){S={team:mkTeam(),sun:false,min:2,Z:null,cur:0}}
else{const gen=p=>/^Collaborateur\b/.test(p.name||'');
 if(S.team.every(gen)){S.team=mkTeam();S.Z=null;S.filter='all'} // ancienne équipe générique -> vraie équipe
 else{const used=new Set(S.team.map(p=>p.name));S.team.filter(gen).forEach(p=>{const f=TEAM0.find(([n,r])=>!used.has(n)&&r===p.role)||TEAM0.find(([n])=>!used.has(n));if(f){p.name=f[0];used.add(f[0])}})}
 localStorage.setItem('zoningStras',JSON.stringify(S))}
S.team.forEach(p=>p.days.forEach(x=>{delete x.start;delete x.end}));const save=()=>localStorage.setItem('zoningStras',JSON.stringify(S));const nD=()=>S.sun?7:6;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function monday(d){d=new Date(d);d.setHours(12);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function setWeek(v){S.week=iso(monday(v?new Date(v+'T12:00'):new Date()));save();render()}
function wk(n){if(!n)return setWeek();const d=new Date(S.week+'T12:00');d.setDate(d.getDate()+n);setWeek(iso(d))}
if(!S.week)S.week=iso(monday(new Date()));if(!S.filter)S.filter='all';
const dDate=i=>{const d=new Date(S.week+'T12:00');d.setDate(d.getDate()+i);return d};
const ini=n=>n.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderPres(){sun.checked=S.sun;minF.value=S.min;let h='<table><tr><th>Nom</th><th>Poste</th>'+DAYS.slice(0,nD()).map(d=>'<th>'+d+'</th>').join('')+'<th></th></tr>';
 S.team.forEach((p,i)=>{h+=`<tr><td><input type=text value="${esc(p.name)}" onchange="S.team[${i}].name=this.value;save();render()"></td>
 <td><select onchange="S.team[${i}].role=this.value;save()"><option ${p.role==='SA'?'selected':''}>SA</option><option ${p.role==='CES'?'selected':''}>CES</option></select></td>`;
 for(let d=0;d<nD();d++){const x=p.days[d];h+=`<td><label><input type=checkbox ${x.absent?'checked':''} onchange="setAbs(${i},${d},this)"> OFF</label><br></td>`}

function addP(){const full=[];S.team.push({id:'p'+Date.now(),name:'Collaborateur '+(S.team.length+1),role:'SA',days:DAYS.map((_,d)=>{const f=d!==6&&nPres(d)>=MAXJ;if(f&&d<nD())full.push(DAYS[d]);return{absent:d===6||f}})});save();renderPres();if(full.length)alert('Maximum '+MAXJ+' collaborateurs par jour : le nouveau collaborateur est marqué OFF le '+full.join(', ')+'.')}
