*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#f2f2f4;-webkit-font-smoothing:antialiased;
background:#050506 radial-gradient(1200px 500px at 50% -200px,#16161b,transparent);min-height:100vh;padding:18px 20px}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;flex-wrap:wrap}

.btn:hover{border-color:#55555f}.nav{display:flex;border:1px solid #2e2e35;border-radius:9px;overflow:hidden}.nav .btn{border:0;border-radius:0}

.dim{color:#666}.col{position:relative;border-left:1px solid #1a1a1e;background:#000!important}

.hr.m45{color:#e0b0b0}.tog{cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}.tog:active{transform:scale(.94);background:rgba(227,25,55,.25)}.tog.tapd{animation:tapF .35s ease-out}.tog.pend{outline:2px solid #e31937;outline-offset:-2px}@keyframes tapF{0%{transform:scale(.9);background:rgba(227,25,55,.45)}100%{transform:scale(1)}}#calcBusy{position:fixed;right:12px;bottom:12px;z-index:9999;background:rgba(20,20,26,.9);color:#d8c29a;font:600 12px system-ui;padding:6px 10px;border-radius:14px;opacity:0;transition:opacity .15s;pointer-events:none}#calcBusy.on{opacity:1}@media print{#calcBusy{display:none}}.tog:hover{background:#2a2a34;box-shadow:inset 0 -2px 0 #e31937}
.card{position:absolute;z-index:2;border-radius:7px;border:1px solid;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 6px rgba(0,0,0,.45);padding:5px 7px;font-size:11px;overflow:hidden;cursor:pointer}
.card:hover{filter:brightness(.95)}.card b{font-size:11px;font-weight:700;letter-spacing:.6px}.card .t{opacity:.85;margin:2px 0;font-size:10px}
.g{}.hr.hh{font-size:10px;font-weight:600;color:#a8a8b2}.wc{display:flex;align-items:center;justify-content:center;padding:0!important}.wc .t,.wc .av,.wc .nm{display:none}.wc b{font-size:10px!important;white-space:nowrap}.wdh{font-size:11px;letter-spacing:0;white-space:normal;padding:8px 3px 4px;line-height:1.25}.wlg{margin-top:14px;font-size:13px;color:#ccc}.wlg i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin:0 6px 0 16px;border:1px solid}.absc{position:absolute;z-index:2;left:3px;right:3px;border-radius:7px;background:linear-gradient(180deg,#3a3a40,#2c2c31);border:1px solid #45454c;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.FLOOR{background:linear-gradient(180deg,#e4f2e8,#d3e8da);color:#163521;border-color:#bcd9c5!important}
.PIPE{background:linear-gradient(180deg,#f29a9a,#ea8585);color:#3a0909;border-color:#de7474!important}
.CLEAN,.CLEAN15{background:linear-gradient(180deg,#e62574,#dd236d 50%,#d61d68);color:#fff;border-color:#a80a4e!important;border-radius:2px!important;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.45)!important;text-shadow:0 1px 1px rgba(0,0,0,.45)}.CLEAN .av,.CLEAN15 .av{background:rgba(0,0,0,.22)}
.PAUSE{background:linear-gradient(180deg,#4dd4ff,#2ec6fa);color:#022233;border-color:#1bb3e8!important}
.BACKUP{background:linear-gradient(180deg,#fff6c4,#fdeea3);color:#4a3b00;border-color:#ead77a!important}
.wc.BACKUP b{white-space:normal!important;text-align:center;line-height:1.1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.av{display:inline-flex;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.25);color:inherit;border:1px solid currentColor;opacity:.85;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-right:4px;vertical-align:middle}
.nm{white-space:nowrap}.warnline{position:absolute;left:0;right:0;height:28px;background:rgba(160,60,60,.12);border-top:1px solid #7a3b3b;pointer-events:none}
table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #2a2a30;padding:3px 4px;text-align:center}
.c.vide{background:#000}.c{border:1px solid #0b0b0d;width:50px;height:26px;cursor:pointer;font-size:9px;font-weight:700}

.off{background:repeating-linear-gradient(45deg,#16161a 0 4px,#0d0d10 4px 8px);cursor:default}.warn{background:#4a2326;color:#e7c9cb}

/* ===== Ambiance « noir & or » (inspiration visuelle) ===== */
:root{--bg:#141414;--bg2:#1f1f1f;--pan:#1a1a1a;--ink:#0b0a09;--gold:#a88148;--gold2:#c9a96e;--cream:#faf7f2;--sand:#e7dfd2;--mut:#8f857a;--line:rgba(168,129,72,.35)}
body{background:var(--bg)!important;color:var(--sand);font-family:Jost,"Futura","Century Gothic","Trebuchet MS",system-ui,sans-serif}
h1{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:500;text-transform:uppercase;letter-spacing:6px;color:var(--gold2)!important;font-size:32px}
.sub{color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;font-size:11px}
h3{color:var(--gold2);letter-spacing:2px;text-transform:uppercase;font-weight:500}
.btn{background:transparent;border:1px solid var(--line);color:var(--sand);border-radius:0;letter-spacing:1.5px;text-transform:uppercase;font-size:11px}
.btn:hover{border-color:var(--gold);color:var(--gold2)}.nav{border:1px solid var(--line);border-radius:0}.nav .btn+.btn{border-left:1px solid var(--line)}
.red{background:var(--gold);border-color:var(--gold);color:var(--ink)!important;font-weight:600}.red:hover{background:var(--gold2);color:var(--ink)}
.tabs .btn.on{background:rgba(168,129,72,.16);border-color:var(--gold);color:var(--gold2)}
.wrap{background:var(--bg2);border:1px solid var(--line);border-radius:2px}
.dpan{background:var(--ink);border:1px solid var(--line);border-radius:2px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.dtitle{background:var(--bg2);color:var(--cream);letter-spacing:3px;text-transform:uppercase;font-weight:500;border-bottom:1px solid var(--line)}.dtitle span{color:var(--gold)}
.hc{background:var(--bg2);border-right:1px solid var(--line)}.dh{background:var(--bg2);color:var(--cream);border-color:#2b2722;letter-spacing:1px}.dh small{color:var(--gold)}
.col{background:var(--ink)!important;border-left:1px solid #26221d}
.hr{color:var(--cream);text-shadow:0 0 3px #000}.hr.hh{color:var(--mut)}.hr.m45{color:var(--gold2)}
.gl .gH{border-top:1px solid rgba(201,169,110,.45)}.gl .gh{border-top:1px dashed rgba(231,223,210,.16)}
.tog:hover{background:rgba(168,129,72,.14);box-shadow:inset 0 -2px 0 var(--gold)}
.legend span,.wlg{color:var(--sand);letter-spacing:1px;text-transform:uppercase;font-size:11px}
.card{border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 2px 6px rgba(0,0,0,.5)}
.FLOOR{background:linear-gradient(180deg,#167c36,#117735 50%,#0d7130);color:#f2fbf4;border-color:#063d20!important;border-radius:2px!important;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.45)!important;text-shadow:0 1px 1px rgba(0,0,0,.4)}.FLOOR .av{background:rgba(0,0,0,.25)}
.PIPE{background:linear-gradient(180deg,#9f0615 0%,#970512 50%,#86020e 100%);color:#fff4f2;border-color:#5e0109!important;border-radius:2px!important;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.75),0 0 14px rgba(20,0,2,.6)!important;text-shadow:0 1px 1px rgba(0,0,0,.45)}.PIPE .av{background:rgba(0,0,0,.3)}
.CLEAN,.CLEAN15{background:linear-gradient(180deg,#e62574,#dd236d 50%,#d61d68);color:#fff;border-color:#a80a4e!important;border-radius:2px!important;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.45)!important;text-shadow:0 1px 1px rgba(0,0,0,.45)}.CLEAN .av,.CLEAN15 .av{background:rgba(0,0,0,.22)}
.PAUSE{background:linear-gradient(180deg,#ed950e,#e88e0b 50%,#e28609);color:#2a1500;border-color:#af5e05!important;border-radius:2px!important;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.45)!important;}
.BACKUP{background:linear-gradient(180deg,#0a42a3,#063c9a 50%,#04348e);color:#f2f6ff;border-color:#011645!important;border-radius:2px!important;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.45)!important;text-shadow:0 1px 1px rgba(0,0,0,.4)}.BACKUP .av{background:rgba(0,0,0,.25)}
.absc{background:repeating-linear-gradient(45deg,#24211d 0 6px,#1c1a17 6px 12px)!important;border:1px solid #2f2a24!important}
.c.vide{background:var(--ink)}.off{background:repeating-linear-gradient(45deg,#1f1c18 0 4px,#141210 4px 8px)}
td,th{border-color:#2b2722}#panel{background:var(--bg2);border-left:1px solid var(--line)}
input,select{background:var(--ink);border-color:var(--line);color:var(--sand)}
.fcell{border-color:#2b2722;color:var(--sand)}.fc{background-color:var(--bg2)}
.card.CLEAN15{padding:0 6px!important;display:flex;align-items:center;overflow:hidden}.card.CLEAN15 b{font-size:10px;line-height:1;white-space:nowrap}.card.CLEAN15 .t{font-size:9px;margin-left:4px}
.EVENT{background:var(--evbg)!important;color:#fff;border-color:#1c1c1c!important;border-radius:2px!important;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.45)!important}.card.EVENT b,.card.EVENT .t,.card.EVENT .nm{background:rgba(20,20,20,.82);padding:1px 5px;border-radius:2px;color:#fff;text-shadow:none;display:inline-block}td.c.EVENT{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}.wlg i.EVENT,.legend i.EVENT{background:var(--evbg)!important}.evbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--sand,#ccc);letter-spacing:1px}.evbar select{background:#0b0a09;color:#eee;border:1px solid #6b5a33;padding:3px 4px;font-size:12px}
@media print{.EVENT{background:var(--evbg)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

<script>
/*ALGO-START*//*backup-oblig*/
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const SLOTS=[];for(let m=540;m<1110;m+=30)SLOTS.push(m); // 9h00..18h00 (fin 18h30)
const toM=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const fmt=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
function presentAt(p,d,m){const h=p.days[d];return !!h&&!h.absent} // tous cadres : présent toute la journée (9h00-18h30) ou absent
function generate(team,nDays,minFloor,keep){
  const Z={};team.forEach(p=>Z[p.id]=DAYS.slice(0,nDays).map(()=>SLOTS.map(()=>null)));
  // EVENT : jamais généré, uniquement manuel ; conservé (keep = ancien planning) et jamais écrasé par un recalcul
  if(keep)team.forEach(p=>{const k=keep[p.id];if(Array.isArray(k))k.forEach((r,d)=>{if(d<nDays&&Array.isArray(r))r.forEach((v,i)=>{if(v==='EVENT'&&i<SLOTS.length)Z[p.id][d][i]='EVENT'})})});
  const bal={},balP={},balB={};team.forEach(p=>{bal[p.id]=0;balP[p.id]=0;balB[p.id]=0}); // floor - pipe (en créneaux)
  const ces=team.filter(p=>p.role==='CES'),sas=team.filter(p=>p.role!=='CES');
  // PIPE CES : uniquement le MARDI, 2h00 chacun si les 2 CES sont présents (10h-12h puis 14h-16h, jamais en même temps) ; 1 seul CES le mardi → pas de PIPE CES ; aucun autre jour
  const cesPipe={},TUE=1;/*PIPE CES mardi 2h supprimé (demande Emmanuel)*/
  const isPipeCES=(p,d,m)=>d===TUE&&cesPipe[p.id]!=null&&m>=cesPipe[p.id]&&m<cesPipe[p.id]+120;
  for(let d=0;d<nDays;d++){
    const pres=p=>SLOTS.map(m=>presentAt(p,d,m));
    team.forEach(p=>{const pr=pres(p);SLOTS.forEach((m,i)=>{if(pr[i]&&m<600&&!Z[p.id][d][i])Z[p.id][d][i]='CLEAN'})});
    // pauses (1h) : CES 12h30 (12h00 le jour où il fait 2h de PIPE 10h-12h, pour éviter un reste de 30 min), SA étalés 12h00/12h30/13h00
    const occ={690:0,720:0,750:0,780:0,810:0,840:0},pst={};
    const setB=(p,st)=>{const i=SLOTS.indexOf(st);if(presentAt(p,d,st)&&presentAt(p,d,st+30)&&!Z[p.id][d][i]&&!Z[p.id][d][i+1]){Z[p.id][d][i]='PAUSE';Z[p.id][d][i+1]='PAUSE';occ[st]++;occ[st+30]++;pst[p.id]=i;return true}return false};
    const cP=ces.filter(p=>presentAt(p,d,720)&&presentAt(p,d,810));
    if(cP.length>=2){ // 2 CES présents : 12h00-13h00 et 13h00-14h00, jamais de chevauchement ; celui qui fait PIPE ce jour prend 12h00, sinon alternance
      const nm=p=>String(p.name||'').trim().toLowerCase(),dv=cP.find(p=>nm(p)==='david'),mn=cP.find(p=>nm(p)==='manale'||nm(p)==='manal');if((d===1||d===3)&&dv&&mn&&cP.length===2){/*mar/jeu : David pause 11h30 + PIPE 12h30-13h30, Manale pause 13h30-14h30 puis PIPE 14h30 → toujours 1 CES au FLOOR, pas de chevauchement PIPE*/setB(dv,690);setB(mn,810)}else{let e=cP.findIndex(p=>d===TUE&&cesPipe[p.id]===600);if(e<0)e=d%2;const first=cP[e],second=cP[1-e];setB(first,720);setB(second,780);}
      cP.slice(2).forEach(p=>[750,720,780].some(st=>setB(p,st)))}
    else ces.forEach(p=>{const pd=d===TUE&&cesPipe[p.id]===600;(pd?[720,750,780]:[750,720,780]).some(st=>setB(p,st))});
    // SA : pauses échelonnées entre SA (priorité) pour qu'au moins 1 SA reste au FLOOR de 12h00 à 14h00
    const so={720:0,750:0,780:0,810:0};
    const sPr=sas.filter(p=>presentAt(p,d,720)&&presentAt(p,d,810)),late=sPr.length>1?sPr[d%sPr.length]:null;/*pauses-couv : tous à 12h sauf 1 SA à 13h (couverture FLOOR continue + FLOOR équitable)*/sas.forEach(p=>{const sc=st=>(sPr.includes(p)?(p===late?(st===780?0:1e6):(st===720?0:1e6)):0)+Math.max(so[st],so[st+30])*1000+Math.max(occ[st],occ[st+30])*10+occ[st]+occ[st+30];const sb=setB;const setB2=st=>{const ok=sb(p,st);if(ok){so[st]++;so[st+30]++}return ok};const opts=[720,780,750].sort((a,b)=>sc(a)-sc(b));opts.some(st=>setB2(st))});
    // CES : FLOOR ; PIPE David 1h au retour de pause (lun-ven, jours travaillés) ; PIPE Manale mardi et jeudi 14h30-15h30
    const pipeCES=(p,m,i)=>{const n=String(p.name||'').trim().toLowerCase();if(n==='manale'||n==='manal')return (d===1||d===3)&&m>=870&&m<930;if(n==='david')return d<5&&pst[p.id]!=null&&i>=pst[p.id]+2&&i<pst[p.id]+4;return false};
    ces.forEach(p=>SLOTS.forEach((m,i)=>{if(presentAt(p,d,m)&&!Z[p.id][d][i]){
      Z[p.id][d][i]=m>=1080?null:m===1050?'CLEAN15':pipeCES(p,m,i)?'PIPE':'FLOOR'}})); // CES : CLEAN 17h30-17h45 (CLEAN15, seul bloc de 15 min, ne compte pas comme FLOOR) ; fin de journée 17h45 (créneau 18h00 vide ; le bloc 17h30 s'affiche jusqu'à 17h45)
    // SA : jamais de retour sur un poste déjà fait : exactement UN bloc FLOOR, UN bloc PIPE, UN bloc BACKUP FLOOR par jour
    // (exception : 2 SA présents → dernière rotation FLOOR 17h00-18h30, 2e FLOOR autorisé) ; pause de préférence entre deux postes (hors 9-10h et pause), blocs ≥ 1h.
    // 12h00-14h00 : toujours ≥ 1 SA au FLOOR (pauses SA échelonnées) ; seul cas qui cède : tous les SA présents en pause au même moment (1 seul SA).
    // ≤ 2 SA en PIPE en même temps, idéalement 1 seul en BACKUP ; BACKUP ne compte pas dans le minimum FLOOR.

// Capture fidèle de la vue affichée : clone du DOM avec styles calculés inline -> SVG foreignObject -> canvas (100 % hors ligne)
function snapView(){return new Promise((res,rej)=>{try{

 const wrap=document.createElement('div');wrap.style.cssText=`position:absolute;left:-99999px;top:0;width:${W}px;padding:${bodyCS.padding};background:${bodyCS.backgroundColor};box-sizing:border-box`;
