<header><div><h1>Zoning d'équipe</h1><div class="sub" id="sub"></div></div>
<div class="bar np"><div class="nav"><button class="btn" onclick="wk(-7)">‹</button><button class="btn" onclick="wk(0)">Aujourd'hui</button><button class="btn" onclick="wk(7)">›</button></div>
<input type="date" id="wpick" onchange="setWeek(this.value)" title="Choisir la semaine">

<button class="btn ico" title="Présences et réglages" onclick="panel.classList.add('open')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#eee" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
<button class="btn" id="vbtn" onclick="S.table=!S.table;save();render()">Vue tableau</button>

<button class="btn" id="jpgbtn" onclick="jpg()" title="Télécharger une image (JPEG) identique à la vue affichée" style="background:#2f4a3a;border-color:#3f6150;color:#fff;font-weight:700">⬇ Télécharger l'image</button><button class="btn red" onclick="gen()">＋ Générer le zoning</button></div></header>
<div class="legend np"><span><i class="dot" style="width:10px;height:10px;border-radius:3px;background:linear-gradient(180deg,#167c36,#0d7130);box-shadow:0 2px 5px rgba(0,0,0,.7);border-radius:2px"></i>FLOOR</span><span><i class="dot" style="width:10px;height:10px;border-radius:3px;background:linear-gradient(180deg,#9f0615,#86020e);box-shadow:0 2px 5px rgba(0,0,0,.7);border-radius:2px"></i>PIPE · PACE</span><span><i class="dot" style="width:10px;height:10px;border-radius:3px;background:linear-gradient(180deg,#0a42a3,#04348e);box-shadow:0 2px 5px rgba(0,0,0,.7);border-radius:2px"></i>BACKUP FLOOR · PACE</span><span><i class="dot" style="width:10px;height:10px;border-radius:3px;background:linear-gradient(180deg,#e62574,#d61d68);box-shadow:0 2px 5px rgba(0,0,0,.7);border-radius:2px"></i>PIPE/CLEAN · CLEAN</span><span><i class="dot" style="width:10px;height:10px;border-radius:3px;background:linear-gradient(180deg,#ed950e,#e28609);box-shadow:0 2px 5px rgba(0,0,0,.7);border-radius:2px"></i>PAUSE</span><span>Clic sur une carte ou une case : FLOOR → PIPE → BACKUP FLOOR → PAUSE → PIPE/CLEAN → vide</span></div>

<label><input type="checkbox" id="sun"> Afficher le dimanche</label>

<div id="pres" style="margin-top:12px;overflow:auto"></div><button class="btn" style="margin-top:10px" onclick="addP()">+ Ajouter un collaborateur</button></div>
<script>
/*ALGO-START*/
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const SLOTS=[];for(let m=540;m<1110;m+=30)SLOTS.push(m); // 9h00..18h00 (fin 18h30)
const toM=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const fmt=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
function presentAt(p,d,m){const h=p.days[d];return !!h&&!h.absent} // tous cadres : présent toute la journée (9h00-18h30) ou absent
function generate(team,nDays,minFloor,keep){
  const Z={};team.forEach(p=>Z[p.id]=DAYS.slice(0,nDays).map(()=>SLOTS.map(()=>null)));
  // EVENT : jamais généré, uniquement manuel ; conservé (keep = ancien planning) et jamais écrasé par un recalcul
  if(keep)team.forEach(p=>{const k=keep[p.id];if(Array.isArray(k))k.forEach((r,d)=>{if(d<nDays&&Array.isArray(r))r.forEach((v,i)=>{if(v==='EVENT'&&i<SLOTS.length)Z[p.id][d][i]='EVENT'})})});
  const bal={},balP={},balB={};team.forEach(p=>{bal[p.id]=0;balP[p.id]=0;balB[p.id]=0}); // floor - pipe (en créneaux)
  const ces=team.filter(p=>p.role==='CES'),sas=team.filter(p=>p.role!=='CES');
  // PIPE CES : uniquement le MARDI, 2h00 chacun si les 2 CES sont présents (10h-12h puis 14h-16h, jamais en même temps) ; 1 seul CES le mardi → pas de PIPE CES ; aucun autre jour
  const cesPipe={},TUE=1;{const cT=ces.filter(p=>TUE<nDays&&[600,630,690,840,870,930].every(m=>presentAt(p,TUE,m)));if(cT.length>=2){cesPipe[cT[0].id]=600;cesPipe[cT[1].id]=840}}
  const isPipeCES=(p,d,m)=>d===TUE&&cesPipe[p.id]!=null&&m>=cesPipe[p.id]&&m<cesPipe[p.id]+120;
  for(let d=0;d<nDays;d++){
    const pres=p=>SLOTS.map(m=>presentAt(p,d,m));
    team.forEach(p=>{const pr=pres(p);SLOTS.forEach((m,i)=>{if(pr[i]&&m<600&&!Z[p.id][d][i])Z[p.id][d][i]='CLEAN'})});
    // pauses (1h) : CES 12h30 (12h00 le jour où il fait 2h de PIPE 10h-12h, pour éviter un reste de 30 min), SA étalés 12h00/12h30/13h00
    const occ={720:0,750:0,780:0,810:0},pst={};
    const setB=(p,st)=>{const i=SLOTS.indexOf(st);if(presentAt(p,d,st)&&presentAt(p,d,st+30)&&!Z[p.id][d][i]&&!Z[p.id][d][i+1]){Z[p.id][d][i]='PAUSE';Z[p.id][d][i+1]='PAUSE';occ[st]++;occ[st+30]++;pst[p.id]=i;return true}return false};
